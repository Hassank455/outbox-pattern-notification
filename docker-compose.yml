services:
  postgres:
    image: postgres:16-alpine
    container_name: outbox-postgres
    # Stage 6: logical WAL so Debezium (CDC) can stream changes. Harmless when Debezium isn't running,
    # as long as no replication slot is left behind (see docs/06-alternative-relays.md).
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # creates notifications_db on first start (each service owns its own database)
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: outbox-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: outbox
      RABBITMQ_DEFAULT_PASS: outbox
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI -> http://localhost:15672 (outbox / outbox)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Stage 6 (experimental): CDC relay. Only starts with: docker compose --profile cdc up -d debezium
  # Run orders-service with RELAY_MODE=none while it's up, or both will publish every event.
  debezium:
    image: quay.io/debezium/server:3.2
    container_name: outbox-debezium
    profiles: ["cdc"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./docker/debezium/conf:/debezium/config:ro
      - debezium-data:/debezium/data

volumes:
  postgres-data:
  rabbitmq-data:
  debezium-data:
