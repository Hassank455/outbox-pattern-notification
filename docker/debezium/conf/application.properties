# Stage 6: Debezium Server, CDC relay (optional; tested on the dev Mac, see docs/06-alternative-relays.md).
# Reads INSERTs into orders_db.public.outbox_messages from the Postgres WAL (logical replication)
# and publishes each one to RabbitMQ, replacing the polling relay. Run orders-service with RELAY_MODE=none.
#
#   docker compose --profile cdc up -d debezium

# ---- source: Postgres -------------------------------------------------------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=outbox
debezium.source.database.password=outbox
debezium.source.database.dbname=orders_db
debezium.source.topic.prefix=orders
debezium.source.table.include.list=public.outbox_messages
# pgoutput is built into Postgres 10+ (no extension needed). Needs wal_level=logical.
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_outbox
debezium.source.publication.name=debezium_outbox_pub
debezium.source.publication.autocreate.mode=filtered
# Don't snapshot the thousands of rows that the relay already published: only stream new INSERTs.
debezium.source.snapshot.mode=no_data
# Where Debezium remembers how far it has read in the WAL (survives restarts via the volume).
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
# How often Debezium Server hands queued changes to the sink. Default 500ms adds ~0.4s of latency.
debezium.source.poll.interval.ms=50

# ---- transform: the outbox event router -------------------------------------
# Turns a row change into "the event": payload column as the body, event id as a header,
# and the topic (= our RabbitMQ routing key) taken from the routing_key column.
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=id
debezium.transforms.outbox.table.field.event.key=aggregate_id
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.table.expand.json.payload=true
debezium.transforms.outbox.route.by.field=routing_key
# escaped so Quarkus doesn't try to expand ${routedByValue} itself (unescaped = NullPointerException at startup)
debezium.transforms.outbox.route.topic.replacement=\\${routedByValue}
debezium.transforms.outbox.table.fields.additional.placement=event_type:header:eventType
# Only INSERTs are events. UPDATEs (e.g. a polling relay marking rows PUBLISHED) are skipped with a warning.
debezium.transforms.outbox.table.op.invalid.behavior=warn

# ---- format: plain JSON bodies, like our relay sends ------------------------
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.header=json
debezium.format.header.schemas.enable=false

# ---- sink: RabbitMQ ---------------------------------------------------------
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=outbox
debezium.sink.rabbitmq.connection.password=outbox
debezium.sink.rabbitmq.exchange=orders.events
# topic name (= routing_key column, e.g. "order.created") becomes the AMQP routing key
debezium.sink.rabbitmq.routingKey.source=topic
debezium.sink.rabbitmq.deliveryMode=2
debezium.sink.rabbitmq.ackTimeout=30000

quarkus.log.level=INFO
quarkus.log.console.json=false
